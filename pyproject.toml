[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG comparison framework: five retrieval pipelines benchmarked on a combined BEIR + MultiHop-RAG + T2-RAGBench golden dataset."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agentic RAG Project" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.2.0",
    "rank-bm25>=0.2.2",
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "numpy>=1.26.0",
    "openai>=1.51.0",
    "typer>=0.12.5",
    "langgraph>=0.6.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
agentic-rag = "agentic_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# demo_page.py is a single Python module that holds an inline HTML+CSS+JS
# string for the demo UI. Ruff lints the embedded JavaScript/CSS lines as
# if they were Python; line-length violations there are not real signals.
"src/agentic_rag/api/demo_page.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` and Typer's `Option(...)`/`Argument(...)` are
# designed to be used as argument defaults; both frameworks introspect the
# call at declaration time, so this is not the mutable-default-argument bug
# B008 otherwise (correctly) warns about.
extend-immutable-calls = [
    "fastapi.Depends",
    "typer.Option",
    "typer.Argument",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
